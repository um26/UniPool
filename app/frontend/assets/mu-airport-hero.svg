<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#315BCB"/><stop offset=".62" stop-color="#24479D"/><stop offset="1" stop-color="#132B5A"/></linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#203B69"/><stop offset="1" stop-color="#0A1832"/></linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9E0E8"/></linearGradient>
  <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#B9543D"/><stop offset="1" stop-color="#873828"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#BFD6E6"/><stop offset=".5" stop-color="#6E91AA"/><stop offset="1" stop-color="#3E627B"/></linearGradient>
  <linearGradient id="warmGlass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFE7A7"/><stop offset="1" stop-color="#D99D45"/></linearGradient>
  <radialGradient id="buildingGlow"><stop stop-color="#FFE1A0" stop-opacity=".7"/><stop offset="1" stop-color="#FFE1A0" stop-opacity="0"/></radialGradient>
  <pattern id="motif" width="190" height="190" patternUnits="userSpaceOnUse"><circle cx="95" cy="95" r="70" fill="none" stroke="#fff" stroke-opacity=".055" stroke-width="3"/><path d="M95 18v154M18 95h154M42 42l106 106M148 42L42 148" stroke="#fff" stroke-opacity=".028" stroke-width="3"/></pattern>
  <filter id="buildingShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#07162F" flood-opacity=".42"/></filter>
  <filter id="softShadow"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-opacity=".25"/></filter>
</defs>

<!-- premium evening campus sky -->
<rect width="1600" height="520" fill="url(#sky)"/>
<rect width="1600" height="520" fill="url(#motif)"/>

<!-- soft clouds -->
<g fill="#fff" opacity=".20">
  <path d="M72 132c19-34 68-34 87 0 31-18 72 3 68 35H16c-3-28 27-48 56-35z"/>
  <path d="M1390 104c17-29 59-30 77 0 28-16 61 3 59 29h-180c-2-23 21-40 44-29z"/>
  <path d="M1220 182c13-23 47-23 60 0 22-13 48 2 46 23h-142c-2-18 17-31 36-23z"/>
</g>

<!-- distant hills -->
<path d="M0 365L130 285l115 73 155-118 130 110 155-92 155 105 150-115 150 106 155-88 165 100v154H0z" fill="#132C58" opacity=".68"/>

<!-- campus glow -->
<ellipse cx="800" cy="350" rx="450" ry="125" fill="url(#buildingGlow)" opacity=".32"/>

<!-- MAHINDRA UNIVERSITY CAMPUS -->
<g filter="url(#buildingShadow)">
  <!-- broad white wings -->
  <rect x="365" y="210" width="870" height="175" rx="3" fill="url(#wall)"/>
  <rect x="390" y="228" width="820" height="18" fill="#FFFFFF" opacity=".95"/>

  <!-- red brick facade -->
  <rect x="425" y="250" width="750" height="135" fill="url(#brick)"/>
  <rect x="425" y="250" width="750" height="7" fill="#D9866E" opacity=".45"/>

  <!-- upper wings with architectural depth -->
  <rect x="385" y="230" width="300" height="70" fill="#E8EDF2"/>
  <rect x="915" y="230" width="300" height="70" fill="#E8EDF2"/>
  <path d="M385 300h300v8H385zM915 300h300v8H915z" fill="#CBD4DE"/>

  <!-- central classical pediment -->
  <path d="M640 211L800 92l160 119z" fill="#F8FAFC" stroke="#CDD5DF" stroke-width="5"/>
  <path d="M668 211L800 113l132 98z" fill="#FFFFFF"/>
  <path d="M688 205h224" stroke="#E1E5EA" stroke-width="4"/>

  <!-- MU mark -->
  <path d="M786 124l14-10 14 10v28l-14 10-14-10z" fill="#D9233E"/>
  <path d="M800 114v48" stroke="#F04A5F" stroke-width="4"/>
  <text x="800" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#172033">Mahindra</text>
  <text x="800" y="203" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#172033">University</text>

  <!-- wing windows, with realistic mullions -->
  <g stroke="#F8FBFF" stroke-width="6">
    <rect x="410" y="244" width="58" height="43" fill="url(#glass)"/>
    <rect x="485" y="244" width="58" height="43" fill="url(#glass)"/>
    <rect x="560" y="244" width="58" height="43" fill="url(#glass)"/>
    <rect x="635" y="244" width="38" height="43" fill="url(#glass)"/>
    <rect x="927" y="244" width="38" height="43" fill="url(#glass)"/>
    <rect x="982" y="244" width="58" height="43" fill="url(#glass)"/>
    <rect x="1057" y="244" width="58" height="43" fill="url(#glass)"/>
    <rect x="1132" y="244" width="58" height="43" fill="url(#glass)"/>
  </g>

  <!-- illuminated central lobby -->
  <rect x="650" y="207" width="300" height="178" fill="#F2F5F8"/>
  <rect x="680" y="230" width="240" height="155" fill="#DDE6ED"/>
  <rect x="694" y="250" width="212" height="135" fill="url(#glass)"/>
  <rect x="705" y="260" width="190" height="7" fill="#FFFFFF" opacity=".55"/>
  <path d="M730 250v135M800 250v135M870 250v135" stroke="#DDE7EF" stroke-width="4" opacity=".8"/>
  <rect x="746" y="286" width="108" height="99" rx="2" fill="url(#warmGlass)" opacity=".7"/>

  <!-- tall portico columns -->
  <g fill="#FFFFFF" stroke="#CBD3DC" stroke-width="3">
    <rect x="670" y="205" width="28" height="180"/>
    <rect x="730" y="205" width="24" height="180"/>
    <rect x="846" y="205" width="24" height="180"/>
    <rect x="902" y="205" width="28" height="180"/>
  </g>
  <g fill="#DCE2E8"><rect x="664" y="205" width="40" height="9"/><rect x="724" y="205" width="36" height="9"/><rect x="840" y="205" width="36" height="9"/><rect x="896" y="205" width="40" height="9"/></g>

  <!-- entrance steps -->
  <path d="M675 385h250l-22 10H697z" fill="#B9C2CD"/>
  <path d="M687 395h226l-18 8H705z" fill="#D8DEE5"/>
  <path d="M699 403h202l-16 8H715z" fill="#B6C0CB"/>

  <!-- facade identity -->
  <g font-family="Arial,sans-serif" fill="#fff">
    <text x="505" y="348" font-size="21" font-weight="800">◆ Mahindra</text>
    <text x="532" y="370" font-size="14">University</text>
  </g>

  <!-- landscaping -->
  <g fill="#153F32">
    <circle cx="410" cy="377" r="27"/><circle cx="450" cy="374" r="34"/><circle cx="489" cy="378" r="25"/>
    <circle cx="1110" cy="378" r="25"/><circle cx="1150" cy="374" r="34"/><circle cx="1190" cy="377" r="27"/>
  </g>
  <g fill="#4C8067" opacity=".7"><circle cx="431" cy="365" r="9"/><circle cx="466" cy="358" r="11"/><circle cx="1138" cy="358" r="11"/><circle cx="1172" cy="365" r="9"/></g>
</g>

<!-- taxi apron immediately in front of campus -->
<rect y="410" width="1600" height="110" fill="url(#ground)"/>
<path d="M0 426H1600" stroke="#FFFFFF" stroke-opacity=".82" stroke-width="3" stroke-dasharray="18 18"/>
<path d="M0 452H1600" stroke="#8EA5C4" stroke-opacity=".35" stroke-width="2"/>
<path d="M0 506H1600" stroke="#8EA5C4" stroke-opacity=".28" stroke-width="2"/>

<!-- runway lights -->
<g fill="#FFD36B">
  <circle cx="70" cy="470" r="4"/><circle cx="245" cy="470" r="4"/><circle cx="420" cy="470" r="4"/>
  <circle cx="1180" cy="470" r="4"/><circle cx="1355" cy="470" r="4"/><circle cx="1530" cy="470" r="4"/>
</g>
<g fill="#7CE4DC" opacity=".8"><circle cx="160" cy="498" r="3"/><circle cx="320" cy="498" r="3"/><circle cx="1280" cy="498" r="3"/><circle cx="1440" cy="498" r="3"/></g>

<!-- A1 centered on the building entrance -->
<circle cx="800" cy="418" r="15" fill="#FFFFFF" stroke="#C9D2DE" stroke-width="2"/>
<circle cx="800" cy="418" r="8" fill="#62D4CA"/>
<text x="800" y="458" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">A1</text>

<!-- subtle edge aircraft silhouettes; animated aircraft are added by React -->
<g fill="#F8FBFF" opacity=".9">
  <path d="M75 393h120l52 11-52 11H75l-32-11z"/>
  <path d="M1450 393h75l45 11-45 11h-75l-26-11z"/>
</g>
</svg>