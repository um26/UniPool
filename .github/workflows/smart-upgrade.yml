name: Apply smart matching upgrade
on:
  push:
    branches: [main]

jobs:
  upgrade:
    if: ${{ !startsWith(github.event.head_commit.message, '[smart-upgrade]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Patch main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request, urllib.error
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']; api=f'https://api.github.com/repos/{repo}/contents/'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','User-Agent':'unipool-smart-upgrade'}
          def get(path):
              req=urllib.request.Request(api+path,headers=headers)
              with urllib.request.urlopen(req) as r: obj=json.load(r)
              return base64.b64decode(obj['content']).decode(),obj['sha']
          def put(path,text,sha,message):
              data=json.dumps({'message':message,'content':base64.b64encode(text.encode()).decode(),'sha':sha,'branch':'main'}).encode()
              req=urllib.request.Request(api+path,data=data,headers={**headers,'Content-Type':'application/json'},method='PUT')
              with urllib.request.urlopen(req) as r: return json.load(r)
          def patch(path,repls,message):
              text,sha=get(path); original=text
              for old,new in repls:
                  if old not in text: raise SystemExit(f'Patch anchor not found in {path}: {old[:100]!r}')
                  text=text.replace(old,new,1)
              if text==original: raise SystemExit(f'No change made to {path}')
              put(path,text,sha,message)
          patch('app/backend/models/pool.py',[
              ('    notes: Optional[str] = None\n','    notes: Optional[str] = None\n    trip_mode: bool = False\n',),
              ('    notes: Optional[str] = None\n\n# MongoDB document','    notes: Optional[str] = None\n    trip_mode: Optional[bool] = None\n\n# MongoDB document',),
              ('    notes: Optional[str] = None\n    status: str = "open"','    notes: Optional[str] = None\n    trip_mode: bool = False\n    status: str = "open"',),
          ],'[smart-upgrade] persist trip mode in pool models')
          patch('app/backend/services/pool_service.py',[
              ('        "notes": body.notes,\n        "status": "open",','        "notes": body.notes,\n        "trip_mode": body.trip_mode,\n        "status": "open",',),
              ('    # Fetch and sort pools\n    cursor = db.pools.find(query, {"_id": 0}).sort("travel_datetime", 1)\n    results = await cursor.to_list(200)\n','    # Fetch candidates, then rank them by route/time/preferences/trust.\n    cursor = db.pools.find(query, {"_id": 0})\n    results = await cursor.to_list(200)\n    from services.match_service import rank_pool_feed\n    results = await rank_pool_feed(user, results)\n',),
          ],'[smart-upgrade] persist trip mode and rank feed')
          smart='''"""Real match scoring and smart feed ranking."""\nfrom datetime import timezone, timedelta\nfrom difflib import SequenceMatcher\nfrom typing import Any, Dict, List, Tuple\nfrom config.database import db\n\ndef _aware(dt):\n    if dt.tzinfo is None or dt.tzinfo.utcoffset(dt) is None: return dt.replace(tzinfo=timezone.utc)\n    return dt\n\ndef _norm(v: Any) -> str: return " ".join(str(v or "").strip().lower().split())\ndef _sim(a,b):\n    a,b=_norm(a),_norm(b)\n    if not a or not b: return 0.0\n    return 1.0 if a==b else SequenceMatcher(None,a,b).ratio()\ndef _route(a,b): return (_sim(a.get("from_location"),b.get("from_location"))+_sim(a.get("to_location"),b.get("to_location")))/2\ndef _time(a,b):\n    try: d=abs((_aware(a["travel_datetime"])-_aware(b["travel_datetime"])).total_seconds())/60\n    except Exception: return 0.0\n    if d<=15:return 1.0\n    if d<=30:return .9\n    if d<=60:return .78\n    if d<=120:return .55\n    if d<=180:return .3\n    return 0.0\ndef _gender(a,b):\n    ga,gb=_norm(a.get("user_gender")),_norm(b.get("user_gender"))\n    for x,y in ((a,b),(b,a)):\n        if x.get("gender_preference")=="same":\n            if not ga or not gb:return .55\n            if ga!=gb:return 0.0\n    return 1.0\ndef _travel(a,b):\n    try:c=max(0,1-min(abs(int(a.get("companions") or 0)-int(b.get("companions") or 0)),3)/4)\n    except Exception:c=.6\n    la,lb=_norm(a.get("luggage")),_norm(b.get("luggage")); l=.6 if not la or not lb else (1.0 if la==lb else .7)\n    return .55*l+.45*c\ndef _trust(c):\n    r=c.get("user_rating_avg"); n=int(c.get("user_rating_count") or 0); badges=len(c.get("user_badges") or [])\n    return (0 if r is None else min(float(r)/5,1))*.55+min(n/10,1)*.25+min(badges/3,1)*.20\ndef _score(a,b):\n    parts={"route":round(_route(a,b)*35),"time":round(_time(a,b)*25),"preferences":round(_gender(a,b)*10),"travel_details":round(_travel(a,b)*10),"trip_mode":round((1 if bool(a.get("trip_mode"))==bool(b.get("trip_mode")) else .55)*5),"trust":round(_trust(b)*15)}\n    return max(0,min(99,sum(parts.values()))),parts\ndef _label(s): return "Excellent fit" if s>=90 else "Strong fit" if s>=80 else "Good fit" if s>=70 else "Possible fit"\nasync def _blocked(uid):\n    docs=await db.blocks.find({"$or":[{"blocker_id":uid},{"blocked_id":uid}]},{"_id":0}).to_list(2000)\n    return {d["blocked_id"] if d["blocker_id"]==uid else d["blocker_id"] for d in docs}\nasync def _enrich(cands):\n    if not cands:return cands\n    ids=list({c["user_id"] for c in cands})\n    stats=await db.ratings.aggregate([{"$match":{"rated_user_id":{"$in":ids}}},{"$group":{"_id":"$rated_user_id","avg":{"$avg":"$stars"},"count":{"$sum":1}}}]).to_list(len(ids))\n    sm={s["_id"]:s for s in stats}\n    for c in cands:\n        s=sm.get(c["user_id"]); c["user_rating_avg"]=round(s["avg"],1) if s else None; c["user_rating_count"]=s["count"] if s else 0\n    return cands\nasync def smart_matches(user_id:str)->List[Dict[str,Any]]:\n    mine=await db.pools.find({"user_id":user_id,"status":"open"},{"_id":0}).to_list(100)\n    if not mine:return []\n    blocked=await _blocked(user_id); lo=min(_aware(p["travel_datetime"]) for p in mine)-timedelta(hours=3); hi=max(_aware(p["travel_datetime"]) for p in mine)+timedelta(hours=3)\n    cands=await db.pools.find({"user_id":{"$ne":user_id,"$nin":list(blocked)},"status":"open","travel_datetime":{"$gte":lo,"$lte":hi}},{"_id":0}).to_list(500)\n    await _enrich(cands); out={}\n    for c in cands:\n        best=None\n        for own in mine:\n            s,b=_score(own,c)\n            if best is None or s>best[0]:best=(s,b,own)\n        if not best:continue\n        s,b,own=best\n        if b["route"]<18 or b["time"]<8 or s<52:continue\n        c["match_score"]=s;c["match_label"]=_label(s);c["match_breakdown"]=b;c["matched_pool_id"]=own.get("pool_id");c["match_time_delta_minutes"]=round(abs((_aware(c["travel_datetime"])-_aware(own["travel_datetime"])).total_seconds()/60)\n        out[c["pool_id"]]=c\n    return sorted(out.values(),key=lambda x:(x.get("match_score",0),-x.get("match_time_delta_minutes",999)),reverse=True)\nasync def rank_pool_feed(user:Dict[str,Any],pools:List[Dict[str,Any]])->List[Dict[str,Any]]:\n    mine=await db.pools.find({"user_id":user["user_id"],"status":"open"},{"_id":0}).to_list(100)\n    if not mine:\n        pools.sort(key=lambda x:_aware(x["travel_datetime"]));return pools\n    await _enrich(pools)\n    for p in pools:\n        best=(0,{})\n        for own in mine:\n            s,b=_score(own,p)\n            if s>best[0]:best=(s,b)\n        p["feed_score"]=best[0];p["match_score"]=best[0];p["match_label"]=_label(best[0]);p["match_breakdown"]=best[1]\n    return sorted(pools,key=lambda x:(x.get("feed_score",0),-_aware(x["travel_datetime"]).timestamp()),reverse=True)\n'''
          data=json.dumps({'message':'[smart-upgrade] add smart match service','content':base64.b64encode(smart.encode()).decode(),'branch':'main'}).encode()
          req=urllib.request.Request(api+'app/backend/services/match_service.py',data=data,headers={**headers,'Content-Type':'application/json'},method='PUT')
          try:
              with urllib.request.urlopen(req): pass
          except urllib.error.HTTPError as e:
              if e.code!=422: raise
          patch('app/backend/routes/pools.py',[
              ('from services.pool_service import (\n    create_pool, get_pool, list_pools, my_pools,\n    close_pool, reopen_pool, delete_pool, get_my_matches, get_confirmed_matches\n)','from services.pool_service import (\n    create_pool, get_pool, list_pools, my_pools,\n    close_pool, reopen_pool, delete_pool, get_my_matches, get_confirmed_matches\n)\nfrom services.match_service import smart_matches'),
              ('        matches = await get_my_matches(user["user_id"])','        matches = await smart_matches(user["user_id"])'),
          ],'[smart-upgrade] activate real matching endpoint')
          patch('app/frontend/app/post-request.tsx',[
              ('setGenderPref(pool.gender_preference || "any"); setCompanions(pool.companions || 0); setLuggage(pool.luggage || ""); setNotes(pool.notes || "");','setGenderPref(pool.gender_preference || "any"); setCompanions(pool.companions || 0); setLuggage(pool.luggage || ""); setNotes(pool.notes || ""); setTripMode(!!pool.trip_mode);'),
              ('const payload = { from_location: from.trim(), to_location: to.trim(), travel_datetime: iso, gender_preference: genderPref, companions, luggage: luggage.trim() || null, notes: notes.trim() || null };','const payload = { from_location: from.trim(), to_location: to.trim(), travel_datetime: iso, gender_preference: genderPref, companions, luggage: luggage.trim() || null, notes: notes.trim() || null, trip_mode: tripMode };'),
          ],'[smart-upgrade] send trip mode from pool creator')
          patch('app/frontend/app/(tabs)/matches.tsx',[
              ('type Pool = { pool_id: string; user_id: string; user_name: string; user_email: string; from_location: string; to_location: string; travel_datetime: string; gender_preference: string; companions: number; luggage?: string | null; notes?: string | null; user_rating_avg?: number | null; user_rating_count?: number; user_badges?: { id: string; label: string; icon: string }[]; conversation_id?: string; conversation_name?: string };','type Pool = { pool_id: string; user_id: string; user_name: string; user_email: string; from_location: string; to_location: string; travel_datetime: string; gender_preference: string; companions: number; luggage?: string | null; notes?: string | null; trip_mode?: boolean; match_score?: number; match_label?: string; match_breakdown?: Record<string, number>; match_time_delta_minutes?: number; user_rating_avg?: number | null; user_rating_count?: number; user_badges?: { id: string; label: string; icon: string }[]; conversation_id?: string; conversation_name?: string };'),
              ('function matchScore(item: Pool) {\n  let score = 72;\n  if (item.user_rating_avg && item.user_rating_avg >= 4.5) score += 10;\n  else if (item.user_rating_avg && item.user_rating_avg >= 4) score += 6;\n  if (item.user_rating_count && item.user_rating_count >= 5) score += 4;\n  if (item.user_badges?.length) score += Math.min(6, item.user_badges.length * 2);\n  if (item.notes?.trim()) score += 3;\n  if (item.luggage?.trim()) score += 2;\n  return Math.min(99, score);\n}\nfunction scoreLabel(score: number) { return score >= 90 ? "Excellent fit" : score >= 82 ? "Strong fit" : "Good fit"; }','function matchScore(item: Pool) { return item.match_score ?? 0; }\nfunction scoreLabel(score: number, item?: Pool) { return item?.match_label || (score >= 90 ? "Excellent fit" : score >= 80 ? "Strong fit" : score >= 70 ? "Good fit" : "Possible fit"); }'),
              ('{score}% · {scoreLabel(score)}','{score}% · {scoreLabel(score, item)}'),
              ('<Text style={styles.signalText}>Score combines route/time fit with available trust and profile signals.</Text>','<Text style={styles.signalText}>{item.match_time_delta_minutes != null ? `${item.match_time_delta_minutes} min time difference · ` : ""}Route/time + preferences + travel details + trust.</Text>'),
          ],'[smart-upgrade] display backend match score')
          PY
          git config user.name 'UniPool Bot'
          git config user.email 'unipool-bot@users.noreply.github.com'
          git add .
          git commit -m '[smart-upgrade] activate smart matching trip mode and feed ranking'
          git push origin main
