name: Apply theme cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[theme-cleanup]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch theme
        shell: python
        run: |
          from pathlib import Path
          def patch(path, replacements):
              p = Path(path)
              s = p.read_text()
              original = s
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'Missing expected text in {path}: {old[:100]!r}')
                  s = s.replace(old, new, 1)
              if s == original:
                  raise SystemExit(f'No changes made to {path}')
              p.write_text(s)

          patch('app/frontend/app/(tabs)/matches.tsx', [
              ('const { colors } = useTheme();', 'const { colors, isDark } = useTheme();'),
              ('const styles = useMemo(() => makeStyles(colors), [colors]);', 'const styles = useMemo(() => makeStyles(colors, isDark), [colors, isDark]);'),
              ('<LinearGradient colors={[colors.saffron, "#F57F17"]} style={styles.header}>', '<LinearGradient colors={isDark ? [colors.surface2, colors.surface3] : [colors.saffron, "#F57F17"]} style={styles.header}>'),
              ('const makeStyles = (colors: any) => StyleSheet.create({', 'const makeStyles = (colors: any, isDark: boolean) => StyleSheet.create({'),
              ('title: { color: "#fff", fontSize:', 'title: { color: isDark ? colors.onSurface : "#fff", fontSize:'),
              ('sub: { color: "rgba(255,255,255,0.9)", marginTop: 2 },', 'sub: { color: isDark ? colors.onSurface2 : "rgba(255,255,255,0.9)", marginTop: 2 },'),
              ('card: { backgroundColor: "#fff",', 'card: { backgroundColor: colors.card,'),
              ('rideCard: { backgroundColor: "#fff",', 'rideCard: { backgroundColor: colors.card,'),
              ('ctaGhost: { backgroundColor: "#fff",', 'ctaGhost: { backgroundColor: colors.card,'),
              ('ctaDanger: { backgroundColor: "#fff",', 'ctaDanger: { backgroundColor: colors.card,'),
          ])

          patch('app/frontend/app/(tabs)/messages.tsx', [
              ('const { colors } = useTheme();', 'const { colors, isDark } = useTheme();'),
              ('const styles = useMemo(() => makeStyles(colors), [colors]);', 'const styles = useMemo(() => makeStyles(colors, isDark), [colors, isDark]);'),
              ('<LinearGradient colors={[colors.indigo, "#3949AB"]} style={styles.header}>', '<LinearGradient colors={isDark ? [colors.surface2, colors.surface3] : [colors.indigo, "#3949AB"]} style={styles.header}>'),
              ('const makeStyles = (colors: any) => StyleSheet.create({', 'const makeStyles = (colors: any, isDark: boolean) => StyleSheet.create({'),
              ('title: { color: "#fff", fontSize:', 'title: { color: isDark ? colors.onSurface : "#fff", fontSize:'),
              ('sub: { color: "rgba(255,255,255,0.9)", marginTop: 2 },', 'sub: { color: isDark ? colors.onSurface2 : "rgba(255,255,255,0.9)", marginTop: 2 },'),
          ])

          patch('app/frontend/app/(tabs)/profile.tsx', [
              ('const styles = useMemo(() => makeStyles(colors), [colors]);', 'const styles = useMemo(() => makeStyles(colors, isDark), [colors, isDark]);'),
              ('<LinearGradient colors={[colors.indigo, "#3949AB"]} style={styles.header}>', '<LinearGradient colors={isDark ? [colors.surface2, colors.surface3] : [colors.indigo, "#3949AB"]} style={styles.header}>'),
              ('const makeStyles = (colors: any) => StyleSheet.create({', 'const makeStyles = (colors: any, isDark: boolean) => StyleSheet.create({'),
              ('name: { color: "#fff", fontSize:', 'name: { color: isDark ? colors.onSurface : "#fff", fontSize:'),
              ('email: { color: "rgba(255,236,194,0.9)", marginTop: 4 },', 'email: { color: isDark ? colors.onSurface2 : "rgba(255,236,194,0.9)", marginTop: 4 },'),
              ('myRatingRow: { flexDirection: "row", alignItems: "center", gap: 5, marginTop: 8, backgroundColor: "rgba(255,236,194,0.15)",', 'myRatingRow: { flexDirection: "row", alignItems: "center", gap: 5, marginTop: 8, backgroundColor: isDark ? colors.surface3 : "rgba(255,236,194,0.15)",'),
              ('myRatingText: { color: colors.cream,', 'myRatingText: { color: isDark ? colors.onSurface : colors.cream,'),
          ])

          p = Path('app/frontend/app/(tabs)/profile.tsx')
          s = p.read_text()
          s2 = s.replace('backgroundColor: "#fff"', 'backgroundColor: colors.card')
          if s2 == s:
              raise SystemExit('No white surfaces found in profile.tsx')
          p.write_text(s2)

          p = Path('app/frontend/app/_layout.tsx')
          s = p.read_text()
          s = s.replace('import AmbientDepth from "@/src/components/AmbientDepth";\n', '')
          s = s.replace('      {user && <AmbientDepth />}\n', '')
          p.write_text(s)
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/frontend/app/_layout.tsx 'app/frontend/app/(tabs)/profile.tsx' 'app/frontend/app/(tabs)/matches.tsx' 'app/frontend/app/(tabs)/messages.tsx'
          git commit -m "fix dark theme surfaces and headers" || exit 0
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/theme-cleanup.yml
          git commit -m "chore: remove temporary theme cleanup workflow"
          git push
